services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaitrack
      POSTGRES_PASSWORD: thaitrack
      POSTGRES_DB: thaitrack
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaitrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://thaitrack:thaitrack@db:5432/thaitrack?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?Set ADMIN_SESSION_SECRET in a .env file next to docker-compose.yml (any long random string)}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  db_data:
