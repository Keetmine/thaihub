services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: thaitrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thaitrack}
      POSTGRES_DB: thaitrack
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thaitrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Образ собирается в GitHub Actions и приезжает из ghcr.io: сборка
    # Next на самом сервере (4 ГБ RAM) отъедала весь процессор и на
    # 8-10 минут делала сайт неотзывчивым. APP_IMAGE задаётся при
    # деплое; без него (локально) собирается из исходников.
    image: ${APP_IMAGE:-myblhub-app:local}
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Зона процесса. Время событий от неё не зависит (тайское настенное
      # читается UTC-компонентами, см. lib/dates.ts), а вот системные даты
      # — «зарегистрирован 18 авг», «оплачено» — должны совпадать с тем,
      # что видит аудитория, иначе вечерние отметки уезжали на сутки.
      TZ: Europe/Moscow
      DATABASE_URL: postgresql://thaitrack:${POSTGRES_PASSWORD:-thaitrack}@db:5432/thaitrack?schema=public
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      NODE_ENV: production
      # Опциональные интеграции — пустые значения просто отключают фичу.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      APP_URL: ${APP_URL:-}
      TMDB_API_READ_ACCESS_TOKEN: ${TMDB_API_READ_ACCESS_TOKEN:-}
      PREMIUM_PRICE_STARS: ${PREMIUM_PRICE_STARS:-250}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
    # Наружу порт не торчит — трафик идёт только через caddy (HTTPS).
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      # Admin-uploaded photos and TMDB-downloaded images (src/lib/localImage.ts)
      # both land in public/uploads — without a named volume here they'd live
      # only in the container's writable layer and vanish on the next
      # `docker compose up --build`.
      - uploads_data:/app/public/uploads

  # HTTPS-терминация: Caddy сам получает и продлевает сертификаты
  # Let's Encrypt для DOMAIN (myblhub.com). Локально (без DOMAIN) сервис
  # можно не поднимать: `docker compose up app db`.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Загруженные картинки отдаёт сам Caddy: Next фиксирует список
      # файлов public/ на сборке, поэтому всё, что появилось в volume
      # позже (импорты, загрузки из админки), он просто не видит и
      # отвечает 404. Плюс статика мимо Node — быстрее.
      - uploads_data:/srv/uploads:ro

  # Ежедневные бэкапы: pg_dump + tar загруженных картинок в ./backups
  # на хосте (держите этот каталог на другом диске или синкайте наружу).
  # Хранится 14 последних копий каждого вида.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-thaitrack}
    volumes:
      - ./backups:/backups
      - uploads_data:/uploads:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -U thaitrack thaitrack | gzip > "/backups/db-$$ts.sql.gz" \
            && echo "backup: db-$$ts.sql.gz"
          tar czf "/backups/uploads-$$ts.tar.gz" -C /uploads . \
            && echo "backup: uploads-$$ts.tar.gz"
          ls -1t /backups/db-*.sql.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          ls -1t /backups/uploads-*.tar.gz 2>/dev/null | tail -n +15 | xargs -r rm -f
          sleep 86400
        done

volumes:
  db_data:
  uploads_data:
  caddy_data:
  caddy_config:
