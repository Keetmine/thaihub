# E2E: Playwright-сьют (tests/e2e) против прод-сборки приложения и
# одноразового Postgres в сервис-контейнере. Не путать с ci.yml
# (тайпчек/линт/сборка) и deploy.yml (автодеплой) — этот workflow ничего
# не деплоит и внешних секретов не требует.
#
# Сервер поднимает сам Playwright: PW_WEB_SERVER=1 включает webServer в
# playwright.config.ts (`npm run build && npm run start -- -p 3001`).
#
# Что скипается в CI (это ожидаемо, не поломка):
#   - duplicate-warning — seed не создаёт драм, коллизию проверять не с чем;
#   - shared-trips (3 теста) — демо-данные (Аня/Маша, их поездка) есть
#     только в дев-базе;
#   - telegram-webhook, суб-кейсы «с верным секретом» — TELEGRAM_WEBHOOK_SECRET
#     в CI не задан (403-кейсы при этом проходят: без секрета вебхук
#     отвечает 403 всегда).
name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: myblhub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e -d myblhub_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://e2e:e2e@localhost:5432/myblhub_e2e
      # APP_URL — внешний адрес сайта (ссылки в уведомлениях, OAuth
      # redirect). В CI совпадает с адресом сервера Playwright.
      APP_URL: http://localhost:3001
      BASE_URL: http://localhost:3001
      PW_WEB_SERVER: "1"
      # Обход лимита логина (src/lib/rateLimit.ts) для e2e. Действует
      # только вне production, поэтому на прод-сборке здесь ничего не
      # отключает (вход один на прогон, лимит 30/10мин недостижим) —
      # флаг продублирован на случай перевода CI на dev-режим. Локально
      # его задаёт webServer-блок playwright.config.ts / сам разработчик.
      E2E_RATE_LIMIT_OFF: "1"
      # TELEGRAM_*, SMTP_*, SENTRY_*, GOOGLE_* намеренно не заданы: всё это
      # опционально (код везде с фолбэками/гвардами), а без токенов тесты
      # гарантированно не дотянутся до внешних сервисов.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      # Демо-каталог: seed даёт будущие события — favorites и premium-gates
      # будет что открывать и избирать.
      - run: npm run db:seed
      # Тестовый админ для admin-* тестов. Креды захардкожены в
      # tests/e2e/helpers.ts (admin-e2e@test.local / admin-e2e-password),
      # env не нужен. Setup-проект (tests/e2e/auth.setup.ts) создаёт его и
      # сам перед единственным за прогон входом — отдельный шаг здесь ловит
      # поломку tsx/Prisma-скриптов до того, как webServer потратит минуты
      # на сборку.
      - run: npx tsx tests/e2e/create-admin-user.ts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # ТОЛЬКО playwright-report: HTML-отчёт УЖЕ содержит трейсы упавших
      # тестов (html-репортер копирует их к себе в data/), и вторая копия
      # из test-results/ просто удваивала вес. Трейс одного теста — это
      # скриншот на каждый шаг, десятки мегабайт; пара упавших прогонов
      # выбирала бесплатные 0,5 ГБ хранилища Actions целиком (письмо
      # GitHub 2026-09-12).
      #
      # Хранение 3 дня, а не 7: отчёт нужен, чтобы разобрать свежее
      # падение, а через три дня либо починено, либо прогон повторён.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
          if-no-files-found: ignore
