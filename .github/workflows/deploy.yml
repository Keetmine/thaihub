# Автодеплой: пуш в main собирает образ здесь, кладёт его в ghcr.io и
# перезапускает сайт на сервере — сервер только скачивает готовое.
# Нужны секреты репозитория (Settings → Secrets → Actions):
#   DEPLOY_HOST — IP сервера
#   DEPLOY_USER — пользователь SSH (обычно root или deploy)
#   DEPLOY_SSH_KEY — приватный ключ (пара к ключу из authorized_keys)
#   DEPLOY_PATH — путь к проекту на сервере
#   GHCR_TOKEN — не обязателен: personal access token с read:packages,
#     если сервер не может тянуть образ под GITHUB_TOKEN
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Образ собираем здесь, а не на сервере: у него 4 ГБ RAM, и сборка
  # Next душила работающий сайт на всё время деплоя.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=ghcr.io/${repo}:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Оба тега — строго в нижнем регистре: ghcr отклоняет
          # «Keetmine/thaihub», а github.repository сохраняет регистр.
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          # Слои переиспользуются между сборками — иначе npm ci и
          # playwright install качались бы каждый раз заново.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            # Слепок до пересборки: энтрипоинт гонит `prisma migrate deploy`
            # на старте, и суточного крон-бэкапа мало — между ним и деплоем
            # может быть почти сутки правок. Держим 5 последних.
            mkdir -p backups
            if docker compose ps --status running --services | grep -qx db; then
              docker compose exec -T db pg_dump -U thaitrack thaitrack \
                | gzip > "backups/pre-deploy-$(date +%Y%m%d-%H%M%S).sql.gz"
              ls -1t backups/pre-deploy-*.sql.gz | tail -n +6 | xargs -r rm --
            fi
            # Готовый образ только скачиваем — на сервере ничего не
            # собирается, сайт во время деплоя работает как обычно.
            export APP_IMAGE="${{ needs.build.outputs.image }}"
            echo "APP_IMAGE=$APP_IMAGE" > .env.image

            if echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" \
                 | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
               && docker compose --env-file .env --env-file .env.image pull app; then
              docker compose --env-file .env --env-file .env.image up -d --no-build
            else
              # Реестр недоступен (нет доступа к пакету, сеть) — не
              # оставляем сайт без обновления, собираем на месте, как
              # раньше. Медленно, но деплой доходит.
              echo "!! не удалось получить образ из ghcr, собираю на сервере"
              rm -f .env.image
              docker compose up -d --build
            fi
            # Чистим агрессивно: 2026-08-19 сервер встал колом с
            # ENOSPC — кеш сборок дорос до 37 ГБ и занял диск целиком,
            # приложение не могло даже применить миграции. Сборка теперь
            # идёт в CI, так что локальный кеш на сервере не нужен вовсе.
            docker image prune -af
            docker builder prune -af

  # Старые версии образа в ghcr.io: их никто не удалял, и за месяц
  # автодеплоя там набираются сотни тегов (по одному на пуш в main), а
  # образ тяжёлый — в нём chromium для парсеров. Держим 15 последних:
  # этого с запасом хватает на откат, а всё, что старше, не нужно никому.
  #
  # ПОСЛЕ деплоя и только при успешном (needs + провалившийся deploy сюда
  # не пустит): удалять образы раньше, чем сервер их скачал, — верный
  # способ остаться без отката ровно в тот момент, когда он нужен.
  # Текущий задеплоенный всегда самый свежий, под нож он не попадёт.
  cleanup-images:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Если шаг однажды упадёт с 403 — GITHUB_TOKEN не дали прав на
      # пакет пользователя; лечится PAT с delete:packages в секретах.
      # Сам деплой к этому моменту уже прошёл, сайт не пострадает.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: thaihub
          package-type: container
          min-versions-to-keep: 15
